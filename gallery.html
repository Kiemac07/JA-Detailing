<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070d12">
  <title>Gallery | JA Detailing</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="JA Detailing logo"><span>JA Detailing</span></a>
    <nav><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="services.html">Services</a></li><li><a class="active" href="gallery.html">Gallery</a></li><li><a href="contact.html">Contact</a></li></ul></nav>
    <button class="menu-btn" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
  <div class="mobile-menu"><a href="index.html">Home</a><a href="services.html">Services</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a></div>
</header>

<main>
<section class="section" style="padding-bottom:42px">
  <div class="container">
    <div class="section-kicker">JA Detailing</div>
    <h1 class="section-title" style="font-size:clamp(48px,13vw,82px)">The<br>Gallery</h1>
    <p class="section-copy">Real results. Professional finishes. Explore JA Detailing's latest work.</p>
  </div>
</section>

<section class="section dark">
  <div class="container">
    <div class="video-wrap">
      <div class="video-placeholder" role="button" tabindex="0" aria-label="Play portrait video fullscreen">
        <video class="gallery-preview-video" preload="metadata" playsinline poster="video-poster.jpg">
          <source src="gallery-video.mp4" type="video/mp4">
        </video>
        <span class="video-play" aria-hidden="true"></span>
      </div>
    </div>

    <div class="section-head">
      <div><div class="section-kicker">Before & After</div><h2 class="section-title">The<br>difference</h2></div>
    </div>

    <div class="gallery-grid">
      <div class="gallery-item before-after-item">
        <div class="before-after">
          <img class="gallery-photo" src="before-after-1.jpg" alt="JA Detailing before and after detail 1" data-full="before-after-1.jpg">
        </div>
      </div>
      <div class="gallery-item before-after-item">
        <div class="before-after">
          <img class="gallery-photo" src="before-after-2.jpg" alt="JA Detailing before and after detail 2" data-full="before-after-2.jpg">
        </div>
      </div>
      <div class="gallery-item before-after-item">
        <div class="before-after">
          <img class="gallery-photo" src="before-after-3.jpg" alt="JA Detailing before and after detail 3" data-full="before-after-3.jpg">
        </div>
      </div>
     <div class="gallery-item gallery-photo-single">
    <img class="gallery-photo" src="exterior.jpg" alt="JA Detailing exterior finish" data-full="exterior.jpg">
</div>

<div class="gallery-item gallery-photo-single">
    <img class="gallery-photo" src="interior.jpg" alt="JA Detailing interior finish" data-full="interior.jpg">
</div>

<div class="gallery-item gallery-photo-single">
    <img class="gallery-photo" src="final-finish.jpg" alt="JA Detailing final finish" data-full="final-finish.jpg">
</div>
    </div>
  </div>
</section>
</main>

<footer><div class="container footer-inner"><div class="footer-brand"><img src="assets/logo.png" alt=""> JA Detailing</div><div class="footer-links"><a href="index.html">Home</a><a href="services.html">Services</a><a href="contact.html">Contact</a></div><div class="footer-note">© <span data-year></span> JA Detailing</div></div></footer>
<script src="script.js"></script>
</body>
</html>
